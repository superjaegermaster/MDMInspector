name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and verify
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build (release)
        run: swift build -c release

      - name: Assemble the .app bundle
        run: ./build_app.sh

      # The self-test runs the real collectors against the real system — it is the
      # only thing here that proves the app still reads logs correctly, rather
      # than merely compiling.
      #
      # Invoked via `swift run` rather than a hardcoded path: SwiftPM places an
      # executable in a directory named after its *target*, which is not the same
      # across SwiftPM versions, so the literal path differs between machines.
      - name: Collector self-test against the live system
        run: swift run -c release MDMInspectorSelfTest

      - name: Confirm the bundle launches
        run: |
          APP="build/MDM Inspector.app"
          test -x "$APP/Contents/MacOS/MDMInspector"
          codesign --verify --deep --strict "$APP" \
            || echo "note: ad-hoc signature only, signature verification is best-effort"